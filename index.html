<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Audio Deck 4</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      background-color: #08090C;
      color: #F1F5F9;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 40px 20px 24px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      user-select: none;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .sub-title {
      font-size: 11px;
      letter-spacing: 3px;
      font-family: monospace;
      color: #64748B;
      font-weight: bold;
    }
    .main-title {
      font-size: 24px;
      font-weight: 600;
    }
    .badge {
      background: #11141C;
      border: 1px solid #1E2433;
      border-radius: 8px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-family: monospace;
      font-weight: bold;
      color: #64748B;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #475569;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      flex-grow: 1;
    }
    .card {
      background: linear-gradient(180deg, #10141D 0%, #0C0E14 100%);
      border: 1px solid #1E2330;
      border-radius: 20px;
      padding: 22px 18px;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
    }
    .card:active { transform: scale(0.96); }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .track-num {
      font-size: 13px;
      font-family: monospace;
      font-weight: bold;
      color: #475569;
    }
    .bars {
      display: flex;
      gap: 3px;
      align-items: flex-end;
      height: 18px;
    }
    .bar {
      width: 3.5px;
      background: #334155;
      border-radius: 1.5px;
    }
    .track-name {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
    }
    .track-status {
      font-size: 10px;
      font-family: monospace;
      letter-spacing: 1.2px;
      color: #64748B;
      margin-top: 4px;
    }
    .card.playing {
      border-color: #38BDF8;
      background: linear-gradient(180deg, #161C26 0%, #0F131A 100%);
    }
    .card.playing .track-num, .card.playing .track-status { color: #38BDF8; }
    .card.playing .bar { background: #38BDF8; }
    .card.paused {
      border-color: #F59E0B;
    }
    .card.paused .track-num, .card.paused .track-status { color: #F59E0B; }
    .card.paused .bar { background: #F59E0B; }

    .reset-btn {
      margin-top: 24px;
      height: 52px;
      border-radius: 14px;
      background: #0F121A;
      border: 1px solid #1F2636;
      color: rgba(239, 68, 68, 0.85);
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .reset-btn:active { background: #1a151b; }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <div class="sub-title">DECK CONTROL</div>
      <div class="main-title">Audio Deck</div>
    </div>
    <div class="badge" id="deckStatus">
      <div class="badge-dot" id="deckDot"></div>
      <span id="deckText">IDLE</span>
    </div>
  </div>

  <div class="grid" id="soundGrid"></div>

  <div class="reset-btn" onclick="allReset()">ALL RESET</div>

  <script>
    // ▼ ここでボタンの表示名と音声ファイル名を変更できます ▼
    const sounds = [
      { id: "01", name: "脱出", src: "sound5.m4a" },
      { id: "02", name: "キーワード",   src: "sound6.m4a" },
      { id: "03", name: "正解の場合",     src: "Sound7.m4a" },
      { id: "04", name: "不正解の場合",   src: "Sound8.m4a" }
    ];

    let currentAudio = null;
    let currentIdx = null;

    const grid = document.getElementById('soundGrid');

    sounds.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${index}`;
      card.onclick = () => toggleSound(index);

      card.innerHTML = `
        <div class="card-top">
          <div class="track-num">${item.id}</div>
          <div class="bars">
            <div class="bar" style="height: 5px;"></div>
            <div class="bar" style="height: 5px;"></div>
            <div class="bar" style="height: 5px;"></div>
          </div>
        </div>
        <div>
          <div class="track-name">${item.name}</div>
          <div class="track-status" id="status-${index}">STANDBY</div>
        </div>
      `;
      grid.appendChild(card);
    });

    function updateDeckStatus(isPlaying) {
      const dot = document.getElementById('deckDot');
      const text = document.getElementById('deckText');
      if (isPlaying) {
        dot.style.background = '#10B981';
        text.style.color = '#10B981';
        text.innerText = 'LIVE';
      } else {
        dot.style.background = '#475569';
        text.style.color = '#64748B';
        text.innerText = 'IDLE';
      }
    }

    function toggleSound(idx) {
      const card = document.getElementById(`card-${idx}`);
      const status = document.getElementById(`status-${idx}`);

      if (currentIdx === idx && currentAudio) {
        if (!currentAudio.paused) {
          currentAudio.pause();
          card.className = 'card paused';
          status.innerText = 'PAUSED';
          setBarHeight(card, 5, 5, 5);
          updateDeckStatus(false);
        } else {
          currentAudio.play();
          card.className = 'card playing';
          status.innerText = 'PLAYING';
          setBarHeight(card, 12, 18, 9);
          updateDeckStatus(true);
        }
        return;
      }

      allReset();

      currentIdx = idx;
      currentAudio = new Audio(sounds[idx].src);
      currentAudio.play();

      card.className = 'card playing';
      status.innerText = 'PLAYING';
      setBarHeight(card, 12, 18, 9);
      updateDeckStatus(true);

      currentAudio.onended = () => {
        allReset();
      };
    }

    function setBarHeight(card, h1, h2, h3) {
      const bars = card.querySelectorAll('.bar');
      bars[0].style.height = `${h1}px`;
      bars[1].style.height = `${h2}px`;
      bars[2].style.height = `${h3}px`;
    }

    function allReset() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        currentAudio = null;
      }
      sounds.forEach((_, idx) => {
        const c = document.getElementById(`card-${idx}`);
        const s = document.getElementById(`status-${idx}`);
        c.className = 'card';
        s.innerText = 'STANDBY';
        setBarHeight(c, 5, 5, 5);
      });
      currentIdx = null;
      updateDeckStatus(false);
    }
  </script>
</body>
</html>
